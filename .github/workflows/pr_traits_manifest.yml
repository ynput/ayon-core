name: 🧬 Check Trait Manifest

on:
  pull_request:
    branches: [ develop ]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base branch is needed to compare with the released manifest
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: ./tools/manage.sh create-env
      - name: Check trait manifest
        # Released traits (in the manifest of the base branch) must not
        # change and server/traits.json must match the trait classes.
        run: >-
          ./tools/manage.sh traits-manifest check
          --base-ref "origin/${{ github.base_ref || 'develop' }}"
